<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><% TITLE %></title>
    <% CSS %>
    <% JAVASCRIPT %>
    <script>
    (function() {
        var STORAGE_KEY = 'twailight-theme';
        var DEFAULT_THEME = 'light';

        function getSystemPreference() {
            if (window.matchMedia) {
                if (window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
                if (window.matchMedia('(prefers-color-scheme: light)').matches) return 'light';
            }
            return null;
        }

        function getSavedTheme() {
            try { return localStorage.getItem(STORAGE_KEY); }
            catch (e) { return null; }
        }

        function saveTheme(theme) {
            try { localStorage.setItem(STORAGE_KEY, theme); }
            catch (e) {}
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
        }

        function getCurrentTheme() {
            return document.documentElement.getAttribute('data-theme') || DEFAULT_THEME;
        }

        function toggleTheme() {
            var current = getCurrentTheme();
            var next = current === 'dark' ? 'light' : 'dark';
            applyTheme(next);
            saveTheme(next);
            updateToggleButton(next);
        }

        function updateToggleButton(theme) {
            var btn = document.getElementById('theme-toggle');
            if (btn) {
                var icon = theme === 'dark' ? '☀️' : '🌙';
                var label = theme === 'dark' ? 'Light Mode' : 'Dark Mode';
                btn.innerHTML = icon + ' ' + label;
            }
        }

        function init() {
            var theme = getSavedTheme() || getSystemPreference() || DEFAULT_THEME;
            applyTheme(theme);
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', function() {
                    updateToggleButton(theme);
                    var btn = document.getElementById('theme-toggle');
                    if (btn) btn.addEventListener('click', toggleTheme);
                });
            } else {
                updateToggleButton(theme);
                var btn = document.getElementById('theme-toggle');
                if (btn) btn.addEventListener('click', toggleTheme);
            }
        }

        init();
    })();
    </script>
</head>
<body>
    <div id="site-wrapper">

        <header id="site-header">
            <div class="header-top">
                <a href="index.php" class="site-logo">Site Name</a>
                <button type="button" id="theme-toggle" class="theme-toggle">🌙 Dark Mode</button>
            </div>
            <div class="board-header"><% BOARD HEADER %></div>
            <nav class="site-nav"><% NAVIGATION %></nav>
        </header>

        <main id="site-content">
            <% BOARD %>
        </main>

        <footer id="site-footer">
            <div class="skin-selector"><% SKIN_SELECTOR %></div>
            <div class="copyright"><% COPYRIGHT %></div>
        </footer>

    </div>
</body>
</html>
