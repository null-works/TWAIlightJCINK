<!DOCTYPE html>
<html lang="en" class="darkMode">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><% TITLE %></title>
  <% CSS %>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&display=swap" rel="stylesheet">
  <script>
    (function() {
      var theme = localStorage.getItem('tw-theme') || 'darkMode';
      document.documentElement.className = theme;
    })();
  </script>
</head>
<body id="act-<!-- |input_act| -->">

  <!-- ==================== SITE HEADER ==================== -->
  <header class="tw-site-header">

    <!-- Top Bar: User Info & Controls -->
    <div class="tw-topbar">
      <div class="tw-topbar-inner">

        <!-- User Welcome -->
        <div class="tw-user-link">
          <span class="g-<!-- |g_id| -->" style="display:none;">Welcome, <strong>Guest</strong></span>
          <span class="m-<!-- |g_id| -->">Welcome back, <a href="?showuser=<!-- |id| -->"><strong><!-- |name| --></strong></a></span>
        </div>

        <!-- User Controls -->
        <div class="tw-user-controls">
          <!-- Guest Links -->
          <span class="g-<!-- |g_id| -->" style="display:none;">
            <a href="?act=Login" class="button">Log In</a>
            <a href="?act=Reg&CODE=00" class="button tw-btn-pop">Register</a>
          </span>

          <!-- Member Links -->
          <span class="m-<!-- |g_id| -->">
            <a href="?act=Msg" class="button">Messages (<!-- |new_msg| -->)</a>
            <a href="?act=UserCP" class="button">Control Panel</a>
            <a href="?act=Login&CODE=03&auth_key=<!-- |auth_key| -->" class="button">Log Out</a>
          </span>

          <!-- Theme Toggle -->
          <button type="button" class="tw-theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
            <svg class="tw-icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path d="M12 7a5 5 0 100 10 5 5 0 000-10zm0-5a1 1 0 011 1v2a1 1 0 11-2 0V3a1 1 0 011-1zm0 18a1 1 0 011 1v2a1 1 0 11-2 0v-2a1 1 0 011-1zm9-9a1 1 0 110 2h-2a1 1 0 110-2h2zM5 12a1 1 0 110 2H3a1 1 0 110-2h2z"/>
            </svg>
            <svg class="tw-icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>
            </svg>
          </button>
        </div>

      </div>
    </div>

    <!-- Hero Grid: Comic Panel Layout -->
    <div class="tw-hero-grid">

      <!-- Main Panel (Large Left) -->
      <div class="tw-hero-grid-item tw-halftone">
        <img src="https://placehold.co/800x600/202028/9370db?text=HERO+IMAGE" alt="Hero">
        <div class="tw-caption">
          <span class="tw-stamp">Issue #01</span>
          Your Site Tagline Here
        </div>
      </div>

      <!-- Panel 2 (Top Right) -->
      <div class="tw-hero-grid-item">
        <img src="https://placehold.co/400x300/2a2a34/9370db?text=PANEL+2" alt="Panel 2">
        <div class="tw-caption">Latest News</div>
      </div>

      <!-- Panel 3 (Top Far Right) -->
      <div class="tw-hero-grid-item">
        <img src="https://placehold.co/400x300/2a2a34/9370db?text=PANEL+3" alt="Panel 3">
        <div class="tw-caption">Featured</div>
      </div>

      <!-- Panel 4 (Bottom Right) -->
      <div class="tw-hero-grid-item">
        <img src="https://placehold.co/400x300/2a2a34/9370db?text=PANEL+4" alt="Panel 4">
        <div class="tw-caption">Updates</div>
      </div>

      <!-- Panel 5 (Bottom Far Right) -->
      <div class="tw-hero-grid-item">
        <img src="https://placehold.co/400x300/2a2a34/9370db?text=PANEL+5" alt="Panel 5">
        <div class="tw-caption">Community</div>
      </div>

    </div>

    <!-- Navigation Bar -->
    <nav class="tw-nav">
      <div class="tw-nav-inner">
        <% NAVIGATION %>
      </div>
    </nav>

  </header>

  <!-- Board Header (Announcements) -->
  <% BOARD HEADER %>

  <!-- ==================== MAIN CONTENT ==================== -->
  <main>
    <div class="tw-wrapper">
      <div class="tw-main tw-paper-texture">
        <% BOARD %>
      </div>
    </div>
  </main>

  <!-- ==================== FOOTER ==================== -->
  <footer class="tw-footer">
    <div class="tw-footer-inner">
      <div class="tw-footer-copyright">
        <% COPYRIGHT %>
      </div>
      <div class="tw-footer-links">
        <% SKIN_SELECTOR %>
      </div>
    </div>
  </footer>

  <% JAVASCRIPT %>
  <script>
  function setTheme(themeName) {
    localStorage.setItem('tw-theme', themeName);
    document.documentElement.className = themeName;
  }

  function toggleTheme() {
    if (localStorage.getItem('tw-theme') === 'darkMode') {
      setTheme('lightMode');
    } else {
      setTheme('darkMode');
    }
  }

  (function() {
    var stored = localStorage.getItem('tw-theme');
    if (stored === 'lightMode') {
      setTheme('lightMode');
    } else {
      setTheme('darkMode');
    }
  })();
  </script>
</body>
</html>
