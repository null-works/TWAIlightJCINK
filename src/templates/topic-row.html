<!-- TOPIC ROW: Individual topic rows in forum view -->

<div class="tw-topic-row <!-- |unread| --> <!-- |topic_type| -->">
  <div class="tw-topic-icon">
    <!-- |folder_icon| -->
  </div>
  <div class="tw-topic-info">
    <div class="tw-topic-title">
      <!-- |topic_icon| -->
      <a href="<!-- |topic_url| -->"><!-- |topic_title| --></a>
      <!-- |topic_pages| -->
    </div>
    <div class="tw-topic-starter">
      Started by <!-- |topic_starter| -->, <!-- |topic_start_date| -->
    </div>
  </div>
  <div class="tw-topic-replies"><!-- |replies| --></div>
  <div class="tw-topic-views"><!-- |views| --></div>
  <div class="tw-topic-lastpost">
    <!-- |last_post| -->
  </div>
</div>
