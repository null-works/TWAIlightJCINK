<!-- FORUM ROW: Individual forum/subforum rows -->

<div class="tw-forum-row <!-- |unread| -->">
  <div class="tw-forum-icon">
    <!-- |folder_icon| -->
  </div>
  <div class="tw-forum-info">
    <div class="tw-forum-title">
      <a href="<!-- |forum_url| -->"><!-- |forum_name| --></a>
      <!-- |forum_markers| -->
    </div>
    <div class="tw-forum-desc"><!-- |forum_desc| --></div>
    <!-- |subforums| -->
  </div>
  <div class="tw-forum-stats">
    <span class="tw-stat-topics"><!-- |topics| --></span>
    <span class="tw-stat-label">Topics</span>
  </div>
  <div class="tw-forum-stats">
    <span class="tw-stat-posts"><!-- |posts| --></span>
    <span class="tw-stat-label">Posts</span>
  </div>
  <div class="tw-forum-lastpost">
    <!-- |last_post| -->
  </div>
</div>
