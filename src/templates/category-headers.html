<!-- CATEGORY HEADERS
     Jcink variables: cat_id, cat_name, collapsed_class, collapse_img
     Required: <% FORUM_ROWS %> macro for forums to display
-->

<!-- |start| -->
<div class="tableborder tw-category" id="cat-<!-- |cat_id| -->">
  <div class="maintitle tw-category-header<!-- |collapsed_class| -->">
    <a href="index.php?c=<!-- |cat_id| -->"><!-- |cat_name| --></a>
    <span class="tw-collapse-btn">
      <a href="#" onclick="catcollapse('<!-- |cat_id| -->');return false;" id="main_<!-- |cat_id| -->"><!-- |collapse_img| --></a>
    </span>
  </div>
  <div class="tw-category-subheader catbg">
    <span class="tw-col-icon"></span>
    <span class="tw-col-forum">Forum</span>
    <span class="tw-col-topics">Topics</span>
    <span class="tw-col-replies">Replies</span>
    <span class="tw-col-lastpost">Last Post Info</span>
  </div>
  <div class="tw-category-body" id="cat_<!-- |cat_id| -->" style="<!-- |collapsed_style| -->">
    <% FORUM_ROWS %>
<!-- |end| -->
  </div>
</div>
