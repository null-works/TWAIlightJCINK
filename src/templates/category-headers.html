<!-- CATEGORY HEADERS
     Jcink variables: cat_id, cat_name, collapsed_class, collapse_img, collapsed_style
     Required: <% FORUM_ROWS %> macro for forums to display

     Comic issue header style - bold title, decorative elements
-->

<!-- |start| -->
<div class="tw-cat tableborder" id="cat-<!-- |cat_id| -->">
  <!-- Category Title Bar (Comic Issue Header) -->
  <div class="tw-cat-header maintitle<!-- |collapsed_class| -->">
    <div class="tw-cat-title">
      <span class="tw-cat-issue">#<!-- |cat_id| --></span>
      <a href="index.php?c=<!-- |cat_id| -->"><!-- |cat_name| --></a>
    </div>
    <div class="tw-cat-actions">
      <a href="#" onclick="catcollapse('<!-- |cat_id| -->');return false;" id="main_<!-- |cat_id| -->" class="tw-cat-toggle">
        <!-- |collapse_img| -->
      </a>
    </div>
  </div>

  <!-- Column Headers (Styled Strip) -->
  <div class="tw-cat-columns catbg">
    <span class="tw-col-icon"></span>
    <span class="tw-col-forum">Forum</span>
    <span class="tw-col-activity">Latest Activity</span>
  </div>

  <!-- Forums Container -->
  <div class="tw-cat-body" id="cat_<!-- |cat_id| -->" style="<!-- |collapsed_style| -->">
    <% FORUM_ROWS %>
<!-- |end| -->
  </div>

  <!-- Category Footer Accent -->
  <div class="tw-cat-footer"></div>
</div>
