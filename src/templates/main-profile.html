<!-- MAIN PROFILE: Full profile page -->

<div class="tw-profile">
  <div class="tw-profile-header">
    <div class="tw-profile-avatar">
      <!-- |avatar| -->
    </div>
    <div class="tw-profile-info">
      <h1 class="tw-profile-name"><!-- |name_formatted| --></h1>
      <div class="tw-profile-title"><!-- |custom_title| --></div>
      <div class="tw-profile-group"><!-- |group_name| --></div>
    </div>
  </div>

  <div class="tw-profile-body">
    <div class="tw-profile-section">
      <h2>Information</h2>
      <div class="tw-profile-field">
        <span class="tw-field-label">Posts:</span>
        <span class="tw-field-value"><!-- |posts| --></span>
      </div>
      <div class="tw-profile-field">
        <span class="tw-field-label">Joined:</span>
        <span class="tw-field-value"><!-- |joined| --></span>
      </div>
      <div class="tw-profile-field">
        <span class="tw-field-label">Last Active:</span>
        <span class="tw-field-value"><!-- |last_active| --></span>
      </div>
      <!-- |custom_fields| -->
    </div>

    <div class="tw-profile-section">
      <h2>Contact</h2>
      <!-- |contact_icons| -->
    </div>

    <div class="tw-profile-section">
      <h2>Signature</h2>
      <div class="tw-profile-signature">
        <!-- |signature| -->
      </div>
    </div>
  </div>
</div>
