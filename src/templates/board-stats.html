<div class="tw-stats tableborder" id="boardstats">
  <div class="tw-stats-header maintitle">
    <span class="tw-stats-icon">&#9733;</span>
    Board Statistics
  </div>
  <div class="tw-stats-body">
    <div class="tw-stats-online pformstrip">
      <span class="tw-stats-live">&#9679;</span>
      <strong><!-- |total_users| --></strong> user(s) active
      <span class="tw-stats-breakdown">(<strong><!-- |total_guests| --></strong> guests, <strong><!-- |total_mems| --></strong> members)</span>
    </div>
    <div class="tw-stats-grid row4">
      <div class="tw-stat-card">
        <div class="tw-stat-num"><!-- |total_posts| --></div>
        <div class="tw-stat-label">Total Posts</div>
      </div>
      <div class="tw-stat-card">
        <div class="tw-stat-num"><!-- |total_topics| --></div>
        <div class="tw-stat-label">Topics</div>
      </div>
      <div class="tw-stat-card">
        <div class="tw-stat-num"><!-- |total_mem_reg| --></div>
        <div class="tw-stat-label">Members</div>
      </div>
      <div class="tw-stat-card tw-stat-newest">
        <div class="tw-stat-label">Newest Member</div>
        <div class="tw-stat-member"><!-- |newest_member| --></div>
      </div>
    </div>
    <div class="tw-stats-users row4">
      <div class="tw-stats-users-label">Online Today:</div>
      <div class="tw-stats-users-list"><!-- |active_users| --></div>
    </div>
  </div>
</div>
