<!-- BOARD STATS: Statistics at bottom of forum index -->

<div class="tw-board-stats">
  <div class="tw-stats-row">
    <div class="tw-stats-block">
      <span class="tw-stats-number"><!-- |total_posts| --></span>
      <span class="tw-stats-label">Posts</span>
    </div>
    <div class="tw-stats-block">
      <span class="tw-stats-number"><!-- |total_members| --></span>
      <span class="tw-stats-label">Members</span>
    </div>
    <div class="tw-stats-block">
      <span class="tw-stats-number"><!-- |newest_member| --></span>
      <span class="tw-stats-label">Newest</span>
    </div>
  </div>
  <div class="tw-stats-online">
    <strong><!-- |online_now| --></strong> members online: <!-- |online_list| -->
  </div>
  <div class="tw-stats-legend">
    <!-- |group_legend| -->
  </div>
</div>
